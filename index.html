/* Tur tur renk geçmişi: beyaz/siyah kare, oynanmayan turlar kesik çizgili */
function colorSeq(h) {
  const cells = h.perRound.map(e => {
    const sat = e.type === 'game' || e.type === 'pending' || (e.type === 'forfeit' && e.pts === 1);
    if (sat) return `<i class="cs ${e.color === 'W' ? 'w' : 'k'}" title="${e.round}. tur: ${e.color === 'W' ? 'beyaz' : 'siyah'}"></i>`;
    const why = { bye: 'bay (renk yok)', half: 'izinli', zero: 'gelmedi', out: 'turnuvada değil', forfeit: 'hükmen yenik' }[e.type] || '';
    return `<i class="cs x" title="${e.round}. tur: ${why}"></i>`;
  }).join('');
  const w = h.colors.filter(c => c === 'W').length, b = h.colors.length - w;
  return `<span class="cseq">${cells}</span><span class="sub">${w} beyaz · ${b} siyah</span>`;
}

function viewPlayers(t) {
  const st = started(t);
  const H = S.buildHistory(t, t.rounds.length);
  const list = st ? [...t.players].sort((a, b) => (a.no || 0) - (b.no || 0)) : S.sortForSeeding(t.players);
  const rows = list.map((p, i) => {
    const h = H.get(p.id);
    return `<tr class="${p.withdrawn ? 'row-out' : ''}">
      <td class="no">${st ? p.no : i + 1}</td>
      <td><span class="pname">${esc(p.name)}</span>${p.withdrawn ? '<span class="tag bad">Çekildi</span>' : ''}${t.pending[p.id] === 'half' ? '<span class="tag">Sonraki tur izinli</span>' : t.pending[p.id] === 'zero' ? '<span class="tag">Sonraki tur gelmeyecek</span>' : ''}</td>
      <td class="num">${p.rating || '<span class="muted">–</span>'}</td>
      <td class="muted">${esc(p.club) || ''}</td>
      ${st ? `<td class="pts">${fmtPts(h.score)}</td><td class="nowrap">${colorSeq(h)}</td>` : ''}
      <td class="num nowrap">
        <button class="btn ghost sm" data-act="edit-player" data-id="${p.id}">Düzenle</button>
        ${st ? `<button class="btn ghost sm" data-act="withdraw" data-id="${p.id}">${p.withdrawn ? 'Geri al' : 'Çekil'}</button>` : ''}
        ${playerUsed(t, p.id) ? '' : `<button class="btn ghost sm danger" data-act="del-player" data-id="${p.id}">Sil</button>`}
      </td></tr>`;
  }).join('');
  return `<section class="card">
    <div class="card-head">
      <div><h2>Oyuncular<span class="count">${t.players.length}</span></h2>
      <p class="muted">${st ? 'Başlangıç numaraları 1. tur eşleştirilirken ELO sırasına göre verildi.' : 'Başlangıç sırası ELO’ya göre otomatik belirlenir (eşitlikte alfabetik).'}</p></div>
      <div class="actions">
        <button class="btn" data-act="bulk">Toplu ekle</button>
        ${t.players.length ? '' : '<button class="btn ghost" data-act="sample">Örnek oyuncular</button>'}
      </div>
    </div>
    <form class="add-row" data-form="add-player" autocomplete="off">
      <input name="name" placeholder="Ad Soyad" required aria-label="Ad Soyad">
      <input name="rating" type="number" min="0" max="3500" placeholder="ELO / UKD" aria-label="ELO">
      <input name="club" placeholder="Kulüp / Şehir" aria-label="Kulüp">
      <button class="btn primary">Ekle</button>
    </form>
    ${t.players.length ? `<div class="tbl-wrap"><table>
      <thead><tr><th>No</th><th>Ad Soyad</th><th class="num">ELO</th><th>Kulüp</th>${st ? '<th class="c">Puan</th><th>Renkler</th>' : ''}<th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>`
    : `<div class="empty"><div class="ic">♟</div><p>Henüz oyuncu yok. Yukarıdan tek tek ekleyin ya da listeyi toplu yapıştırın.</p></div>`}
    ${t.players.length >= 2 && !st ? `<div class="pair-bar"><span class="muted">Oyuncu listesi hazırsa ilk turu eşleştirin.</span><button class="btn primary" data-act="tab" data-tab="rounds">1. tura geç →</button></div>` : ''}
  </section>`;
}

function viewRounds(t) {
  const R = t.rounds.length, total = t.settings.rounds;
  const lastDone = R === 0 || S.isRoundComplete(t.rounds[R - 1]);
  const canNext = R < total;
  const maxView = R + (canNext ? 1 : 0);
  if (ui.round == null || ui.round < 1 || ui.round > maxView) ui.round = R === 0 ? 1 : (!lastDone || !canNext ? R : R + 1);
  let chips = '';
  for (let r = 1; r <= R; r++) {
    const done = S.isRoundComplete(t.rounds[r - 1]);
    chips += `<button class="chip ${ui.round === r ? 'on' : ''}" data-act="round" data-r="${r}">${r}. Tur ${done ? '<span class="ok">✓</span>' : '<span class="dot" title="Eksik sonuç var"></span>'}</button>`;
  }
  if (canNext) chips += `<button class="chip next ${ui.round === R + 1 ? 'on' : ''}" data-act="round" data-r="${R + 1}">＋ ${R + 1}. Tur</button>`;
  const body = ui.round === R + 1 ? viewSetup(t, R + 1, lastDone) : viewRound(t, ui.round - 1);
  return `<div class="chips">${chips}</div>${body}`;
}

/* Bir sonraki turda kimin bay geçeceğini, kaydetmeden deneme eşleştirmesiyle bulur. */
function previewBye(t) {
  try {
    const tc = { ...t, players: t.players.map(p => ({ ...p })) };
    if (!started(tc)) S.sortForSeeding(tc.players).forEach((p, i) => { p.no = i + 1; });
    const g = S.pairNextRound(tc).pairings.find(x => x.black == null);
    return g ? (tc.players.find(p => p.id === g.white) || {}).name || '' : '';
  } catch (e) { return ''; }
}

function viewSetup(t, rn, lastDone) {
  if (t.players.filter(p => !p.withdrawn).length < 2) {
    return `<section class="card"><div class="empty"><div class="ic">♟</div><p>Eşleştirme için en az 2 oyuncu gerekli.</p><button class="btn primary" data-act="tab" data-tab="players">Oyuncu ekle</button></div></section>`;
  }
  const H = S.buildHistory(t, t.rounds.length);
  const st = started(t);
  const act = (st ? t.players.filter(p => !p.withdrawn).sort((a, b) => H.get(b.id).score - H.get(a.id).score || a.no - b.no)
    : S.sortForSeeding(t.players.filter(p => !p.withdrawn)));
  const wd = t.players.filter(p => p.withdrawn);
  const playing = act.filter(p => !t.pending[p.id]).length;
  const items = act.map(p => {
    const v = t.pending[p.id] || 'play';
    const b = (val, l) => `<button class="${v === val ? 'on' : ''}" data-act="att" data-id="${p.id}" data-v="${val}">${l}</button>`;
    return `<div class="att ${v}">${st ? `<span class="sc">${fmtPts(H.get(p.id).score)}</span>` : ''}<span class="nm" title="${esc(p.name)}">${esc(p.name)}</span>
      <div class="seg sm">${b('play', 'Oynar')}${b('half', 'İzinli ½')}${b('zero', 'Gelmeyecek')}</div></div>`;
  }).join('');
  const byeName = playing % 2 && lastDone ? previewBye(t) : '';
  const byeInfo = !(playing % 2) ? '' : byeName
    ? `<div class="bye-preview"><span class="tag bye">BAY</span> Oyuncu sayısı tek. Bay geçecek oyuncu kurala göre otomatik seçildi: <b>${esc(byeName)}</b> (+${fmtPts(t.settings.byePoints)} puan). Eşleştirmede son masaya eklenecek.</div>`
    : `<div class="bye-preview"><span class="tag bye">BAY</span> Oyuncu sayısı tek; bay geçecek oyuncuyu program eşleştirme sırasında otomatik seçecek.</div>`;
  return `<section class="card">
    <div class="card-head"><div><h2>${rn}. tur eşleştirmesi</h2>
      <p class="muted">Herkes oynayacaksa hiçbir şey seçmeden doğrudan eşleştirin. Sadece bu tura gelmeyecek oyuncu varsa işaretleyin: <b>İzinli</b> ½ puan, <b>Gelmeyecek</b> 0 puan alır. Bayı siz seçmezsiniz, program belirler.${rn === 1 ? ' İlk turda sıralamanın üst yarısı alt yarısıyla eşleşir.' : ''}</p></div></div>
    ${!lastDone ? `<div class="notice warn"><b>${rn - 1}. turda sonucu girilmemiş masalar var.</b> Önce tüm sonuçları girin.</div>` : ''}
    <div class="att-grid">${items}</div>
    ${wd.length ? `<p class="muted" style="margin:14px 0 0">Çekilen oyuncular (eşleştirilmez): ${wd.map(p => esc(p.name)).join(', ')}</p>` : ''}
    ${byeInfo}
    <div class="pair-bar">
      <div><b>${playing}</b> oyuncu eşleşecek${playing % 2 ? ` · ${(playing - 1) / 2} masa + 1 bay` : ` · ${playing / 2} masa`}</div>
      <button class="btn primary lg" data-act="pair" ${(!lastDone || playing < 1) ? 'disabled' : ''}>${rn}. turu eşleştir</button>
    </div>
  </section>`;
}

function pcell(p, side, b, editable, right) {
  const piece = side ? `<span class="pc ${side === 'white' ? 'w' : 'k'}"></span>` : '';
  const inner = `${piece}<span class="pname">${esc(p.name)}</span><span class="sub">${p.no ? '#' + p.no : ''}${p.rating ? ' · ' + p.rating : ''}</span>`;
  if (!editable) return `<span class="plc">${inner}</span>`;
  const on = ui.sel && ui.sel.b === b && ui.sel.side === side;
  return `<button class="pick ${on ? 'on' : ''}" data-act="pick" data-b="${b}" data-side="${side}">${inner}</button>`;
}
function resultControl(g, b) {
  const r = g.result;
  const btn = (v, l, title) => `<button class="${r === v ? 'on' : ''}" data-act="res" data-b="${b}" data-r="${v}" title="${title}">${l}</button>`;
  const forfeit = r === '+-' || r === '-+' || r === '--';
  return `<div class="seg">${btn('1-0', '1–0', 'Beyaz kazandı')}${btn('=', '½–½', 'Berabere')}${btn('0-1', '0–1', 'Siyah kazandı')}<select class="${forfeit ? 'on' : ''}" data-change="res-more" data-b="${b}" title="Hükmen sonuçlar">
      <option value="" ${forfeit ? '' : 'selected'}>⋯</option>
      <option value="+-" ${r === '+-' ? 'selected' : ''}>+/−</option>
      <option value="-+" ${r === '-+' ? 'selected' : ''}>−/+</option>
      <option value="--" ${r === '--' ? 'selected' : ''}>−/−</option>
      ${r ? '<option value="clear">Sil</option>' : ''}
    </select></div><span class="print-only">${r ? RES_LABEL[r] : '…… – ……'}</span>`;
}

function viewRound(t, ri) {
  const rd = t.rounds[ri];
  if (!rd) return '';
  const R = t.rounds.length, isLast = ri === R - 1;
  const Hb = S.buildHistory(t, ri);
  const pm = pmapOf(t);
  const games = rd.pairings.filter(g => g.black != null);
  const done = games.filter(g => S.RESULTS[g.result]).length;
  const editable = ui.edit && isLast;
  const complete = done === games.length;
  const rows = rd.pairings.map((g, b) => {
    const w = pm[g.white] || { name: '?' };
    const sw = Hb.get(g.white)?.score ?? 0;
    if (g.black == null) {
      // Bay geçen oyuncu renk almaz; beyaz/siyah sütununa konmaz, satırı kaplar.
      return `<tr class="bye-row"><td class="board">${b + 1}</td><td class="bye-cell" colspan="5"><span class="tag bye">BAY</span> ${pcell(w, null, b, editable)}
        <span class="sep">·</span>${fmtPts(sw)} puan<span class="sep">·</span>rakip yok, <b>+${fmtPts(t.settings.byePoints)} puan</b>, renk almaz</td></tr>`;
    }
    const k = pm[g.black] || { name: '?' };
    const sk = Hb.get(g.black)?.score ?? 0;
    const rem = Hb.get(g.white)?.opponents.has(g.black);
    return `<tr class="${rem && editable ? 'rematch' : ''}">
      <td class="board">${b + 1}${editable ? ` <button class="icon-btn" data-act="flip" data-b="${b}" title="Renkleri değiştir">⇄</button>` : ''}</td>
      <td class="pl">${pcell(w, 'white', b, editable)}</td>
      <td class="pts">${fmtPts(sw)}</td>
      <td class="res">${resultControl(g, b)}</td>
      <td class="pts">${fmtPts(sk)}</td>
      <td class="pl">${pcell(k, 'black', b, editable)}${rem ? '<span class="tag warn">Tekrar eşleşme</span>' : ''}</td>
    </tr>`;
  }).join('');
  const byeG = rd.pairings.find(g => g.black == null);
  const bp = fmtPts(t.settings.byePoints);
  const absent = (rd.absent || []).filter(a => pm[a.id]).map(a => `<span class="abs-item"><b>${esc(pm[a.id].name)}</b>
    <select class="no-print" data-change="absent-type" data-r="${ri}" data-id="${a.id}" aria-label="Durum">
      <option value="zero" ${a.type === 'half' ? '' : 'selected'}>gelmedi (0)</option>
      <option value="half" ${a.type === 'half' ? 'selected' : ''}>izinli (½)</option>
      ${byeG ? '' : `<option value="bye">aslında bay geçti (+${bp})</option>`}
    </select><span class="print-only">(${a.type === 'half' ? 'izinli, ½' : 'gelmedi, 0'})</span></span>`);
  const finished = isLast && complete && R >= t.settings.rounds;
  const pct = games.length ? Math.round(done / games.length * 100) : 100;
  return `${finished ? `<div class="notice"><b>Turnuva tamamlandı.</b> Son sıralamayı görmek için <a href="#" data-act="tab" data-tab="standings">Sıralama</a> sekmesine geçin. Ek tur gerekirse tur sayısını ayarlardan artırabilirsiniz.</div>` : ''}
  <section class="card">
    <div class="card-head">
      <div><h2>${ri + 1}. Tur</h2>
        <div class="progress" style="margin-top:6px"><div class="bar"><i style="width:${pct}%"></i></div>${done}/${games.length} sonuç girildi</div></div>
      <div class="actions">
        ${isLast ? `<button class="btn ${ui.edit ? 'primary' : ''}" data-act="edit-toggle">${ui.edit ? 'Düzenlemeyi bitir' : 'Eşleştirmeyi düzenle'}</button>` : ''}
        ${isLast ? '<button class="btn danger" data-act="del-round">Turu sil</button>' : ''}
        <button class="btn" data-act="print">Yazdır</button>
        <button class="btn primary" data-act="pdf-round" data-r="${ri}">PDF indir</button>
      </div>
    </div>
    ${byeG && pm[byeG.white] ? `<div class="notice no-print"><span class="tag bye">BAY</span> <b>${esc(pm[byeG.white].name)}</b> bu tur bay geçiyor (+${fmtPts(t.settings.byePoints)} puan). Oyuncu sayısı tek olduğu için program kurala göre seçti: en düşük puan grubunda, daha önce bay geçmemiş en alt sıradaki oyuncu.</div>` : ''}
    ${(rd.warnings || []).map(w => `<div class="notice warn">${esc(w)}</div>`).join('')}
    ${editable ? '<div class="notice">Yer değiştirmek için iki oyuncuya sırayla tıklayın. ⇄ masadaki renkleri değiştirir. Değişen masaların sonuçları silinir.</div>' : ''}
    <div class="tbl-wrap"><table class="pairings">
      <thead><tr><th>Masa</th><th>Beyaz</th><th class="c">Puan</th><th class="c">Sonuç</th><th class="c">Puan</th><th>Siyah</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${absent.length ? `<div class="abs-list"><span class="muted">Bu turda oynamayanlar:</span> ${absent.join('')}</div>` : ''}
    <div class="legend no-print"><span><b>+/−</b> Beyaz hükmen kazandı</span><span><b>−/+</b> Siyah hükmen kazandı</span><span><b>−/−</b> İki oyuncu da gelmedi</span><span>Seçili sonuca tekrar tıklamak sonucu siler.</span></div>
    ${isLast && complete && R < t.settings.rounds ? `<div class="pair-bar no-print"><span class="muted">Tüm sonuçlar girildi.</span><button class="btn primary" data-act="round" data-r="${R + 1}">${R + 1}. tura geç →</button></div>` : ''}
  </section>`;
}

function standUpto(t) {
  const R = t.rounds.length;
  let u = ui.standRound;
  if (u == null || u > R || u < 0) u = R;
  return u;
}
function viewStandings(t) {
  if (!t.players.length) return `<section class="card"><div class="empty"><div class="ic">♟</div><p>Sıralama için önce oyuncu ekleyin.</p></div></section>`;
  const R = t.rounds.length;
  const upto = standUpto(t);
  const rows = S.computeStandings(t, upto);
  const keys = t.settings.tiebreaks;
  const final = upto === t.settings.rounds && upto > 0 && S.isRoundComplete(t.rounds[upto - 1]);
  const partial = upto > 0 && !S.isRoundComplete(t.rounds[upto - 1]);
  const opts = [];
  for (let r = R; r >= 1; r--) opts.push(`<option value="${r}" ${r === upto ? 'selected' : ''}>${r}. tur sonrası</option>`);
  const body = rows.map(r => {
    const medal = final && !r.shared && r.place <= 3 ? `<span class="medal m${r.place}">${r.place}</span>` : r.placeLabel;
    return `<tr class="${r.p.withdrawn ? 'row-out' : ''}">
      <td class="place">${medal}</td><td class="no">${r.p.no || ''}</td>
      <td><span class="pname">${esc(r.p.name)}</span>${r.p.withdrawn ? '<span class="tag bad">Çekildi</span>' : ''}</td>
      <td class="num">${r.p.rating || ''}</td><td class="muted">${esc(r.p.club)}</td>
      <td class="score">${fmtPts(r.pts)}</td>
      ${keys.map(k => `<td class="num">${fmtTb(k, r.tb[k])}</td>`).join('')}
    </tr>`;
  }).join('');
  return `<section class="card">
    <div class="card-head">
      <div><h2>${final ? 'Son sıralama' : 'Sıralama'}</h2>
        <p class="muted">${R ? (partial ? `${upto}. turda eksik sonuçlar var; girilenler dahil.` : `${upto}. tur sonrası`) : 'Henüz tur oynanmadı.'}</p></div>
      <div class="actions">
        ${R > 1 ? `<select data-change="stand-round" aria-label="Tur">${opts.join('')}</select>` : ''}
        <button class="btn" data-act="csv">Excel (CSV)</button>
        <button class="btn" data-act="print">Yazdır</button>
        <button class="btn primary" data-act="pdf-stand">PDF indir</button>
        ${R ? '<button class="btn" data-act="pdf-full" title="Sıralama, çapraz tablo ve tüm turların eşleştirme/sonuçları">Tüm rapor (PDF)</button>' : ''}
      </div>
    </div>
    <div class="print-only"><b>${final ? 'Son sıralama' : `Sıralama — ${upto}. tur sonrası`}</b></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Sıra</th><th>No</th><th>Ad Soyad</th><th class="num">ELO</th><th>Kulüp</th><th class="c">Puan</th>
        ${keys.map(k => `<th class="num" title="${esc(S.TIEBREAKS[k].name)}">${S.TIEBREAKS[k].short}</th>`).join('')}</tr></thead>
      <tbody>${body}</tbody>
    </table></div>
    <div class="legend">${keys.map((k, i) => `<span><b>${i + 1}. ${S.TIEBREAKS[k].short}</b> ${esc(S.TIEBREAKS[k].name)}</span>`).join('')}</div>
  </section>`;
}

function viewCross(t) {
  const R = t.rounds.length;
  if (!R) return `<section class="card"><div class="empty"><div class="ic">♟</div><p>Çapraz tablo ilk tur eşleştirildikten sonra oluşur.</p><button class="btn primary" data-act="tab" data-tab="rounds">Turlara git</button></div></section>`;
  const rows = S.computeStandings(t, R);
  const placeOf = {};
  rows.forEach((r, i) => { placeOf[r.p.id] = i + 1; });
  const k0 = t.settings.tiebreaks[0];
  const body = rows.map((r, i) => {
    const cells = r.h.perRound.map(e => {
      if (e.type === 'game' || e.type === 'forfeit' || e.type === 'pending') {
        const res = e.type === 'pending' ? '?' : e.type === 'forfeit' ? (e.pts ? '+' : '−') : (e.pts === 1 ? '1' : e.pts === 0 ? '0' : '½');
        const cls = e.type === 'pending' ? '' : e.pts === 1 ? 'win' : e.pts === 0 ? 'loss' : '';
        return `<td class="rc ${cls}"><span class="op">${placeOf[e.opp]}</span><span class="cl">${e.color === 'W' ? 'B' : 'S'}</span><span class="rs">${res}</span></td>`;
      }
      if (e.type === 'bye') return `<td class="rc win"><span class="op">bay</span> <span class="rs">${fmtPts(e.pts)}</span></td>`;
      if (e.type === 'half') return `<td class="rc"><span class="op">izinli</span> <span class="rs">½</span></td>`;
      return `<td class="rc loss"><span class="rs">–</span></td>`;
    }).join('');
    return `<tr><td class="place">${i + 1}</td><td><span class="pname">${esc(r.p.name)}</span></td><td class="num">${r.p.rating || ''}</td>${cells}<td class="score">${fmtPts(r.pts)}</td>${k0 ? `<td class="num">${fmtTb(k0, r.tb[k0])}</td>` : ''}</tr>`;
  }).join('');
  const rh = Array.from({ length: R }, (_, i) => `<th class="c">${i + 1}</th>`).join('');
  return `<section class="card">
    <div class="card-head"><div><h2>Çapraz tablo</h2><p class="muted">Her hücre: rakibin sıra numarası, renk (B = beyaz, S = siyah) ve sonuç.</p></div>
      <div class="actions"><button class="btn" data-act="print">Yazdır</button><button class="btn primary" data-act="pdf-cross">PDF indir</button></div></div>
    <div class="tbl-wrap"><table class="cross">
      <thead><tr><th>Sıra</th><th>Ad Soyad</th><th class="num">ELO</th>${rh}<th class="c">Puan</th>${k0 ? `<th class="num">${S.TIEBREAKS[k0].short}</th>` : ''}</tr></thead>
      <tbody>${body}</tbody>
    </table></div>
  </section>`;
}

function viewSettings(t) {
  const st = started(t);
  const s = t.settings;
  const tbItems = s.tiebreaks.map((k, i) => `<li><span class="ix">${i + 1}</span><span class="tx">${esc(S.TIEBREAKS[k].name)} <span class="muted">(${S.TIEBREAKS[k].short})</span><small>${esc(S.TIEBREAKS[k].desc)}</small></span>
      <button class="icon-btn" data-act="tb-move" data-i="${i}" data-d="-1" title="Yukarı" ${i === 0 ? 'disabled' : ''}>↑</button>
      <button class="icon-btn" data-act="tb-move" data-i="${i}" data-d="1" title="Aşağı" ${i === s.tiebreaks.length - 1 ? 'disabled' : ''}>↓</button>
      <button class="icon-btn" data-act="tb-del" data-i="${i}" title="Kaldır">✕</button></li>`).join('');
  const avail = Object.keys(S.TIEBREAKS).filter(k => !s.tiebreaks.includes(k));
  return `<div class="grid2">
    <section class="card">
      <div class="card-head"><h2>Turnuva bilgileri</h2></div>
      <label class="field"><span>Turnuva adı</span><input data-field="name" value="${esc(t.name)}"></label>
      <label class="field"><span>Yer</span><input data-field="place" value="${esc(t.place)}" placeholder="ör. Ankara"></label>
      <label class="field"><span>Tarih</span><input type="date" data-field="date" value="${esc(t.date)}"></label>
      <label class="field"><span>Başhakem</span><input data-field="arbiter" value="${esc(t.arbiter)}"></label>
    </section>
    <section class="card">
      <div class="card-head"><h2>Kurallar</h2></div>
      <label class="field"><span>Tur sayısı</span><input type="number" min="${Math.max(1, t.rounds.length)}" max="30" data-field="settings.rounds" value="${s.rounds}">
        <small>Oyuncu sayısı N ise en az log₂(N) tur önerilir (ör. 16 oyuncu → 4–5 tur).</small></label>
      <label class="field"><span>Bay geçen oyuncunun puanı</span><select data-field="settings.byePoints">
        ${[[1, '1 puan'], [0.5, '½ puan'], [0, '0 puan']].map(([v, l]) => `<option value="${v}" ${Number(s.byePoints) === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label class="field"><span>Renk önceliği</span><select data-field="settings.colorPriority">
        <option value="balanced" ${s.colorPriority !== 'fide' ? 'selected' : ''}>Dengeli (önerilen)</option>
        <option value="fide" ${s.colorPriority === 'fide' ? 'selected' : ''}>FIDE — puan grubu her zaman önce</option></select>
        <small>${s.colorPriority === 'fide'
          ? 'Puan grupları korunur; renk farkı ±2’ye (ör. 4 oyunda 3 beyaz) daha sık çıkabilir.'
          : 'Bir oyuncunun beyaz–siyah farkı 2’ye çıkacaksa (ör. 4 oyunda 3 beyaz), program onu yakın puanlı başka bir rakiple eşleştirir.'}</small></label>
      <label class="field"><span>1 numaralı oyuncunun 1. turdaki rengi</span><select data-field="settings.firstColor" ${st ? 'disabled' : ''}>
        ${[['W', 'Beyaz'], ['B', 'Siyah'], ['random', 'Kura (rastgele)']].map(([v, l]) => `<option value="${v}" ${s.firstColor === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        ${st ? `<small>Turnuva başladı (${t.initialColor === 'B' ? 'siyah' : 'beyaz'} ile).</small>` : ''}</label>
    </section>
    <section class="card">
      <div class="card-head"><div><h2>Eşitlik bozma (averaj) sırası</h2><p class="muted">Puanı eşit oyuncular bu sıraya göre ayrılır.</p></div></div>
      <ul class="tb-list">${tbItems || '<li class="muted">Kriter yok — eşitlikte başlangıç numarası kullanılır.</li>'}</ul>
      ${avail.length ? `<select data-change="tb-add" aria-label="Kriter ekle"><option value="">＋ Kriter ekle…</option>${avail.map(k => `<option value="${k}">${esc(S.TIEBREAKS[k].name)}</option>`).join('')}</select>` : ''}
    </section>
    <section class="card">
      <div class="card-head"><div><h2>Yedekleme</h2><p class="muted">Veriler bu bilgisayarda, tarayıcının içinde saklanır. Tarayıcı verilerini temizlerseniz silinir; düzenli yedek alın.</p></div></div>
      <div class="actions">
        <button class="btn primary" data-act="export">Yedek indir (.json)</button>
        <button class="btn" data-act="import">Yedekten yükle</button>
        ${t.rounds.length ? '<button class="btn" data-act="pdf-full">Turnuva raporu (PDF)</button>' : ''}
        <button class="btn" data-act="new-t">Yeni turnuva</button>
        <button class="btn danger" data-act="del-t">Turnuvayı sil</button>
      </div>
    </section>
    <section class="card span2">
      <div class="card-head"><h2>Eşleştirme nasıl yapılır?</h2><span class="muted">Chesspresso Eşleştirme v${APP_VERSION}</span></div>
      <div class="help muted">
        <p><b>Puan grupları.</b> Her turda oyuncular puanlarına göre gruplanır. Aynı puandaki grup, Hollanda (Dutch) sistemindeki gibi ikiye bölünür: üst yarı alt yarıyla eşleşir (8 kişilik grupta 1–5, 2–6, 3–7, 4–8).</p>
        <p><b>Tekrar yok.</b> İki oyuncu turnuvada ikinci kez karşılaşmaz. Hükmen sonuçlanan maçlar oynanmamış sayılır.</p>
        <p><b>Renk dengesi.</b> Kimse aynı renkle üst üste üç kez oynamaz ve beyaz–siyah farkı 2’yi geçmez. “Dengeli” modda farkın 2’ye çıkması da (ör. 4 oyunda 3 beyaz) önlenir; mümkün olduğunca herkes renk değiştirir. Bay ve izinli turlar renk sayılmaz; hükmen kazanılan maçta masadaki renk sayılır. Oyuncuların tur tur renkleri Oyuncular sekmesinde görünür.</p>
        <p><b>Kaydırma.</b> Grup tek sayıysa en alttaki oyuncu bir alt gruba kayar; aynı oyuncunun üst üste kaydırılmasından kaçınılır.</p>
        <p><b>Bay.</b> Oyuncu sayısı tekse, en düşük puan grubunda daha önce bay geçmemiş (hükmen de kazanmamış) en alt sıradaki oyuncu bay geçer.</p>
        <p><b>Tek seferde en iyi çözüm.</b> Bu kurallar öncelik sırasıyla ağırlıklandırılır ve Edmonds eşleştirme algoritması tüm olasılıklar arasından en iyisini bulur; çıkmaza girmez.</p>
        <p><b>Not.</b> Program FIDE kurallarını yakından izler ancak FIDE onaylı bir eşleştirme motoru değildir. Resmî ELO/UKD işlenecek turnuvalarda federasyonun istediği yazılımı kullanın.</p>
        <p><b>Averaj.</b> Oynanmayan turlar (bay, hükmen, izin) Buchholz ve Sonneborn-Berger hesabında oyuncunun kendi puanına sahip sanal bir rakiple oynanmış sayılır.</p>
      </div>
    </section>
  </div>`;
}

/* ---------- Olaylar ---------- */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (el.tagName === 'A') ev.preventDefault();
  const t = T();
  switch (act) {
    case 'tab': ui.tab = el.dataset.tab; ui.edit = false; ui.sel = null; saveUi(); render(); window.scrollTo({ top: 0 }); break;
    case 'round': ui.round = +el.dataset.r; ui.edit = false; ui.sel = null; render(); break;
    case 'res': setResult(+el.dataset.b, el.dataset.r, true); break;
    case 'att': if (el.dataset.v === 'play') delete t.pending[el.dataset.id]; else t.pending[el.dataset.id] = el.dataset.v; commit(); break;
    case 'pair': doPair(); break;
    case 'del-round': deleteLastRound(); break;
    case 'edit-toggle': ui.edit = !ui.edit; ui.sel = null; render(); break;
    case 'pick': pick(+el.dataset.b, el.dataset.side); break;
    case 'flip': flip(+el.dataset.b); break;
    case 'print': window.print(); break;
    case 'bulk': bulkAdd(); break;
    case 'sample': addSamples(); break;
    case 'edit-player': editPlayer(el.dataset.id); break;
    case 'withdraw': toggleWithdraw(el.dataset.id); break;
    case 'del-player': deletePlayer(el.dataset.id); break;
    case 'tb-move': moveTb(+el.dataset.i, +el.dataset.d); break;
    case 'tb-del': t.settings.tiebreaks.splice(+el.dataset.i, 1); commit(); break;
    case 'export': exportJSON(); break;
    case 'import': $('#fileIn').value = ''; $('#fileIn').click(); break;
    case 'new-t': newTournamentDialog(); break;
    case 'del-t': deleteTournament(); break;
    case 'csv': exportCSV(); break;
    case 'pdf-round': pdfRound(+el.dataset.r); break;
    case 'pdf-stand': pdfStandings(); break;
    case 'pdf-cross': pdfCross(); break;
    case 'pdf-full': pdfFull(); break;
    case 'close-dlg': $('#dlg').close('cancel'); break;
  }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  const t = T();
  if (el.id === 'fileIn') { if (el.files[0]) importJSON(el.files[0]); return; }
  const ch = el.dataset.change;
  if (ch === 'switch-t') {
    if (el.value === '__new') { newTournamentDialog(); return; }
    db.activeId = el.value; ui.round = null; ui.standRound = null; ui.edit = false; ui.sel = null;
    commit(); return;
  }
  if (ch === 'res-more') { if (el.value) setResult(+el.dataset.b, el.value); return; }
  if (ch === 'stand-round') { ui.standRound = +el.value; render(); return; }
  if (ch === 'absent-type') {
    const rd = t.rounds[+el.dataset.r];
    const a = rd && (rd.absent || []).find(x => x.id === el.dataset.id);
    if (!a) return;
    if (el.value === 'bye') {
      rd.absent = rd.absent.filter(x => x !== a);
      rd.pairings.push({ white: a.id, black: null, result: 'BYE' });
      toast(`${(t.players.find(p => p.id === a.id) || {}).name} için ${+el.dataset.r + 1}. tur bay olarak düzeltildi`);
    } else a.type = el.value;
    commit();
    return;
  }
  if (ch === 'tb-add') { if (el.value) { t.settings.tiebreaks.push(el.value); commit(); } return; }
  const f = el.dataset.field;
  if (f && t) {
    if (f === 'settings.rounds') {
      const v = Math.max(1, t.rounds.length, Math.min(30, parseInt(el.value, 10) || 1));
      t.settings.rounds = v;
      if (ui.round > t.rounds.length) ui.round = null;
    } else if (f === 'settings.byePoints') t.settings.byePoints = Number(el.value);
    else if (f === 'settings.firstColor') t.settings.firstColor = el.value;
    else if (f === 'settings.colorPriority') t.settings.colorPriority = el.value;
    else if (f === 'name') t.name = el.value.trim() || t.name;
    else t[f] = el.value.trim();
    commit();
  }
});
document.addEventListener('submit', ev => {
  const form = ev.target;
  const kind = form.dataset.form;
  if (!kind) return;
  ev.preventDefault();
  const fd = Object.fromEntries(new FormData(form));
  if (kind === 'create') { createTournament(fd.name.trim(), parseInt(fd.rounds, 10)); commit(); return; }
  if (kind === 'add-player') {
    const t = T();
    const p = addPlayer(t, fd.name, fd.rating, fd.club);
    if (!p) return;
    ui.focusAdd = true;
    commit();
    if (started(t)) toast(`${p.name} eklendi (#${p.no}). Önceki turlardan 0 puan alır.`, 'warn');
  }
});
window.addEventListener('storage', e => { if (e.key === LS_KEY) { load(); render(); } });

load();
render();
})();
</script>
